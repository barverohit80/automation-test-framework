name: Monthly Macro Stock Screener

on:
  schedule:
    # Runs at 10:00 AM IST (04:30 AM UTC) on the 18th of every month
    - cron: '30 04 18 * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests yfinance matplotlib

    - name: Run Macro Screener
      run: python macro_stock_screener.py

    - name: Commit and Push History
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add historical_verdicts.csv
        git commit -m "Update monthly macro history [skip ci]" || echo "No changes to commit"
        git push origin main
