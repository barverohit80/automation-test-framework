name: Daily Upper Circuit Screener

on:
  schedule:
    # 9:20 AM IST is 03:50 AM UTC
    - cron: '50 03 * * 1-5'
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas requests nsepython feedparser

    - name: Run Screener
      run: python daily_upper_circuit_screener.py

    - name: Commit and Push History
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add daily_circuit_log.csv
        git commit -m "Update daily circuit history [skip ci]" || echo "No changes to commit"
        git push origin main
